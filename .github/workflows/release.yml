name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v1.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate version
        id: vars
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "${VERSION}" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version must look like v1.2.0 or 1.2.0" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build production
        run: bun run build

      - name: Create zip
        env:
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          cd dist
          zip -r "../bracekit-${VERSION}.zip" .

      - name: Sign extension (.crx)
        env:
          CRX_PRIVATE_KEY: ${{ secrets.CRX_PRIVATE_KEY }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "${CRX_PRIVATE_KEY}" ]; then
            echo "CRX_PRIVATE_KEY secret is empty" >&2
            exit 1
          fi
          KEY="${RUNNER_TEMP}/crx_private_key.pem"
          printf '%s' "${CRX_PRIVATE_KEY}" | base64 --decode > "${KEY}"
          chmod 600 "${KEY}"
          # ubuntu-latest runners already include Google Chrome; Chrome for Testing
          # (setup-chrome) is not a drop-in for --pack-extension.
          google-chrome --no-sandbox --disable-gpu \
            --pack-extension="${GITHUB_WORKSPACE}/dist" \
            --pack-extension-key="${KEY}"
          mv "${GITHUB_WORKSPACE}/dist.crx" "bracekit-${VERSION}.crx"

      - name: Remove signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/crx_private_key.pem"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: BraceKit ${{ steps.vars.outputs.version }}
          files: |
            bracekit-${{ steps.vars.outputs.version }}.zip
            bracekit-${{ steps.vars.outputs.version }}.crx
          generate_release_notes: true

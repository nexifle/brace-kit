<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Preview</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
    }
    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
    #empty {
      display: none;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      align-items: center;
      justify-content: center;
      font: 14px/1.4 system-ui, sans-serif;
      color: #666;
      padding: 24px;
      text-align: center;
    }
    #empty.visible { display: flex; }
    body.empty iframe { display: none; }
  </style>
</head>
<body>
  <div id="empty">No preview</div>
  <iframe id="preview" title="Site preview" src="site-preview-frame.html"></iframe>
  <script type="module" src="site-preview.js"></script>
</body>
</html>
